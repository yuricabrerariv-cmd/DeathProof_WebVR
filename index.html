<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Death Proof Project</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="./script.js" defer></script>
    
    <link rel="stylesheet" href="./css/modalstyles.css">
    
</head>

<body>

    <!-- START SCREEN -->
    <div id="start-screen">

        <button id="start-btn">

            START EXPERIENCE

        </button>

    </div>

    <!-- VIDEO OVERLAY -->
    <div id="intro-video-container">

        <video
            id="intro-video"
            playsinline>

            <source
                src="./assets/video/disclaimer_DEATH_PROOF_00.mp4"
                type="video/mp4">

        </video>

    </div>

    <!-- Starts muted until the user clicks (browser autoplay policy requires a gesture) -->
    <button id="sound-btn" title="Unmute sound">&#128263;</button>

    <a-scene id="main-scene" style="opacity:0;">
        <!-- Assets Management System -->
        <a-assets>

            <a-assets-item
                id="dp-scene"
                src="./assets/chevy_nova_scene_webpTextures_glb/chevy_nova_scene_external_textures.gltf?v=20260608">
            </a-assets-item>

            <img
                id="photo1"
                src="./assets/chevy_nova_scene_webpTextures_glb/photo1.webp">

            <img
                id="photo2"
                src="./assets/chevy_nova_scene_webpTextures_glb/photo2.webp">

        </a-assets>

        <a-entity
            id="deathProofModel"
            gltf-model="#dp-scene"
            scroll-animation-scrub>
        </a-entity>

        <!-- Audio -->
            <a-entity sound="src:./assets/AUDIO/Engine Rev Continuous.mp3; autoplay:false; loop:true; volume:0"></a-entity>
        
        <!-- Camera Rig / Wrapper -->
        <!-- The Camera -->
            <a-camera wasd-controls="enabled: false" user-height="0" look-controls>
                <a-cursor
                    color="white"
                    rayOrigin="mouse"
                    material="opacity: 0">
                </a-cursor>
            </a-camera>

        <!-- VR Camera — inactive until VR is entered; rig is repositioned at that point -->
            <a-entity id="VRcameraRig">
                <a-camera id="vr-camera"
                    camera="active: false"
                    wasd-controls="enabled: false"
                    user-height="0"
                    look-controls="pointerLockEnabled: true">
                </a-camera>
            </a-entity>

    </a-scene>

    <!-- FILM GRAIN OVERLAY -->
    <div id="film-grain-overlay">
        <video
            id="film-grain-video"
            loop
            muted
            playsinline>
            <source src="./assets/video/old%20film%20grain%20overlay.mp4" type="video/mp4">
        </video>
    </div>

    <div id="modal" class="modal">

        <div class="modal-content">

            <span id="closeModal">&times;</span>

            <img
                id="modalImage"
                style="display:none;">

            <iframe
                id="youtubeFrame"
                width="900"
                height="500"
                style="display:none;"
                allowfullscreen>
            </iframe>

        </div>

    </div>
</body>
</html>
